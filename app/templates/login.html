{% extends "base.html" %}{% block title %}Login — PocketSmart AI{% endblock %}
{% block content %}<div class="auth-card"><h1>Welcome back</h1><p>Sign in to access your planners and history.</p>
<form id="loginForm" class="form"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label>
<button class="btn primary" type="submit">Login</button><div id="message"></div></form><p>New here? <a href="/register">Create an account</a></p></div>{% endblock %}
{% block scripts %}<script>bindLogin();</script>{% endblock %}
