{% extends "base.html" %}{% block title %}Register — PocketSmart AI{% endblock %}
{% block content %}<div class="auth-card"><h1>Create your account</h1><p>Save recommendation plans and revisit them later.</p>
<form id="registerForm" class="form"><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label>
<button class="btn primary" type="submit">Register</button><div id="message"></div></form><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}
{% block scripts %}<script>bindRegister();</script>{% endblock %}
